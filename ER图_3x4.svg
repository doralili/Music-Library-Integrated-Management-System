  <rect x="620" y="440" width="120" height="52" class="entity"/>
  <text x="680" y="466" class="label">歌单</text>

  <rect x="350" y="710" width="120" height="52" class="entity"/>
  <text x="410" y="736" class="label">帖子</text>

  <rect x="620" y="850" width="120" height="52" class="entity"/>
  <text x="680" y="876" class="label">帖子评论</text>

  <!-- Relations -->
  <polygon points="275,132 305,146 275,160 245,146" class="relation"/>
  <text x="275" y="146" class="rlabel">创作</text>

  <polygon points="545,232 575,246 545,260 515,246" class="relation"/>
  <text x="545" y="246" class="rlabel">收录</text>

  <polygon points="275,232 305,246 275,260 245,246" class="relation"/>
  <text x="275" y="246" class="rlabel">演唱</text>

  <polygon points="275,342 305,356 275,370 245,356" class="relation"/>
  <text x="275" y="356" class="rlabel">发表</text>

  <polygon points="545,342 575,356 545,370 515,356" class="relation"/>
  <text x="545" y="356" class="rlabel">针对</text>

  <polygon points="275,452 305,466 275,480 245,466" class="relation"/>
  <text x="275" y="466" class="rlabel">创建</text>

  <polygon points="545,452 575,466 545,480 515,466" class="relation"/>
