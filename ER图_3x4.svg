  <polygon points="275,722 305,736 275,750 245,736" class="relation"/>
  <text x="275" y="736" class="rlabel">发帖</text>

  <polygon points="545,722 575,736 545,750 515,736" class="relation"/>
  <text x="545" y="736" class="rlabel">推荐</text>

  <polygon points="545,862 575,876 545,890 515,876" class="relation"/>
  <text x="545" y="876" class="rlabel">针对</text>

  <polygon points="410,982 440,996 410,1010 380,996" class="relation"/>
  <text x="410" y="996" class="rlabel">评论</text>

