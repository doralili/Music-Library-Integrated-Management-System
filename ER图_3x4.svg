<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <style>
      .entity { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; rx: 10; ry: 10; }
      .relation { fill: #fff4d6; stroke: #8a6a00; stroke-width: 2.2; }
      .attr { fill: #eef6ff; stroke: #4d78a8; stroke-width: 1.8; }
      .line { fill: none; stroke: #374151; stroke-width: 2; }
      .label { font: 600 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .rlabel { font: 700 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #7c5a00; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1200" fill="#ffffff"/>

  <!-- Entities -->
  <rect x="80" y="120" width="120" height="52" class="entity"/>
  <text x="140" y="146" class="label">歌手</text>

  <rect x="350" y="120" width="120" height="52" class="entity"/>
  <text x="410" y="146" class="label">专辑</text>

  <rect x="620" y="220" width="120" height="52" class="entity"/>
  <text x="680" y="246" class="label">歌曲</text>

  <rect x="80" y="440" width="120" height="52" class="entity"/>
  <text x="140" y="466" class="label">用户</text>

  <rect x="350" y="330" width="120" height="52" class="entity"/>
